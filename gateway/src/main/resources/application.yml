spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: info-service
              uri: http://localhost:8081
              predicates:
                - Path=/app/**

            - id: question-service
              uri: http://localhost:8082
              predicates:
                - Path=/questions/**

            - id: quiz-service
              uri: http://localhost:8083
              predicates:
                - Path=/quiz/**

            - id: history-service
              uri: http://localhost:8084
              predicates:
                - Path=/history/**

server:
  port: 8080