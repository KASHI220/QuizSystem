services:

  # =========================
  # INFO DATABASE
  # =========================

  info-db:
    image: postgres:18
    container_name: quiz-info-db
    environment:
      POSTGRES_DB: QuizUsers
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - info-db-data:/var/lib/postgresql
    networks:
      - quiz-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d QuizUsers"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # =========================
  # HISTORY DATABASE
  # =========================

  history-db:
    image: postgres:18
    container_name: quiz-history-db
    environment:
      POSTGRES_DB: QuizHistory
      POSTGRES_USER: ${HISTORY_DB_USERNAME}
      POSTGRES_PASSWORD: ${HISTORY_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - history-db-data:/var/lib/postgresql
    networks:
      - quiz-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${HISTORY_DB_USERNAME} -d QuizHistory"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # =========================
  # KAFKA
  # =========================

  kafka:
    image: apache/kafka:4.1.0
    container_name: quiz-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - quiz-network


  # =========================
  # INFO SERVICE
  # =========================

  info:
    build:
      context: ./info
    image: quiz-info:latest
    container_name: quiz-info
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://info-db:5432/QuizUsers
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      info-db:
        condition: service_healthy
    networks:
      - quiz-network


  # =========================
  # QUESTION SERVICE
  # =========================

  question:
    build:
      context: ./question
    image: quiz-question:latest
    container_name: quiz-question
    ports:
      - "8082:8082"
    environment:
      MONGODB_URI: ${MONGODB_URI}
    depends_on:
      kafka:
        condition: service_started
    networks:
      - quiz-network


  # =========================
  # QUIZ SERVICE
  # =========================

  quiz:
    build:
      context: ./quiz
    image: quiz-service:latest
    container_name: quiz-service
    ports:
      - "8083:8083"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_started
      question:
        condition: service_started
    networks:
      - quiz-network


  # =========================
  # HISTORY SERVICE
  # =========================

  history:
    build:
      context: ./history
    image: quiz-history:latest
    container_name: quiz-history
    ports:
      - "8084:8084"
    environment:
      HISTORY_DB_URL: jdbc:postgresql://history-db:5432/QuizHistory
      HISTORY_DB_USERNAME: ${HISTORY_DB_USERNAME}
      HISTORY_DB_PASSWORD: ${HISTORY_DB_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      history-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - quiz-network


  # =========================
  # API GATEWAY
  # =========================

  gateway:
    build:
      context: ./gateway
    image: quiz-gateway:latest
    container_name: quiz-gateway
    ports:
      - "8080:8080"
    depends_on:
      info:
        condition: service_started
      question:
        condition: service_started
      quiz:
        condition: service_started
      history:
        condition: service_started
    networks:
      - quiz-network


# =========================
# VOLUMES
# =========================

volumes:

  info-db-data:

  history-db-data:

  kafka-data:


# =========================
# NETWORK
# =========================

networks:

  quiz-network:
    name: quiz-network
